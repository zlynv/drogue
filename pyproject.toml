[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drogue"
version = "0.1.2"
description = "Production-ready rate limiting and DDoS protection for Python web frameworks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "zlynv" }]
keywords = ["rate-limiting", "ddos", "throttling", "fastapi", "django", "security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Framework :: Django",
    "Framework :: Flask",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0.0"]
fastapi = ["fastapi>=0.100.0", "starlette>=0.27.0"]
django = ["django>=4.2"]
flask = ["flask>=3.0.0"]
drf = ["django>=4.2", "djangorestframework>=3.14"]
prometheus = ["prometheus-client>=0.17.0"]
opentelemetry = ["opentelemetry-api>=1.0.0", "opentelemetry-sdk>=1.0.0"]
adaptive = ["psutil>=5.0.0"]
all = [
    "drogue[redis,fastapi,django,flask,drf,prometheus,opentelemetry,adaptive]",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/drogue"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = ["E501", "B008", "TC002"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
